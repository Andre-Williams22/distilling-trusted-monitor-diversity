[project]
name = "distilling-trusted-monitor-diversity"
version = "0.1.0"
description = "Can inference-time monitor diversity be distilled into a single trusted monitor?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# One dependency list. Environment markers do the platform work, so
# `pip install -r requirements.txt` installs the right thing on every machine
# and there are no extras to remember.
#
# vllm and bitsandbytes have NO macOS wheels, so a flat unmarked list would
# fail on Apple Silicon. torch/transformers/trl/peft are marked Linux-only too,
# not because they cannot install on a Mac but because nothing on a Mac uses
# them -- the local pilot runs through MLX -- and they are hundreds of MB.
dependencies = [
    # Core: needed everywhere.
    "datasets>=4.0",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "tqdm>=4.66",

    # Analysis: splits, metrics, statistics, figures. Pure CPU, runs anywhere.
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",

    # Development.
    "pytest>=8.3",
    "ruff>=0.6",

    # Serving and training. Linux + CUDA only.
    "accelerate>=1.0 ; sys_platform == 'linux'",
    "bitsandbytes>=0.44 ; sys_platform == 'linux'",
    "peft>=0.13 ; sys_platform == 'linux'",
    "torch>=2.4 ; sys_platform == 'linux'",
    "transformers>=4.45 ; sys_platform == 'linux'",
    "trl>=0.11 ; sys_platform == 'linux'",
    "vllm>=0.6 ; sys_platform == 'linux'",

    # Local pilot scoring. Apple Silicon only.
    "mlx-lm>=0.19 ; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# Deliberately absent: control-arena. Only its dataset is used, pulled straight
# from Hugging Face. See docs/adr/0004-*.md -- it drags in 33 dependencies
# (docker, kubernetes-asyncio, minio, redis, flask) and pins
# huggingface-hub~=0.33, which would fight vllm/transformers/trl on the GPU box.

[tool.uv]
# `src/` is imported directly from the repo root (`from src.data import ...`),
# so there is nothing to build or install. This keeps `uv sync` dependency-only.
package = false

[tool.ruff]
line-length = 88
target-version = "py311"
# Exploratory notebooks are not held to library lint rules.
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
