[project]
name = "distilling-trusted-monitor-diversity"
version = "0.1.0"
description = "Can inference-time monitor diversity be distilled into a single trusted monitor?"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Core: everything both the laptop and the GPU box need.
dependencies = [
    "datasets>=4.0",
    "huggingface-hub>=0.34",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# `uv sync --extra data` — runs on the arm64 Mac. No CUDA anywhere in here.
# Everything through split construction, plus all metrics, stats and figures.
data = [
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
    "scipy>=1.14",
]

# `uv sync --extra gpu` — the rented A6000 only. None of this installs on
# Apple Silicon, which is exactly why the tiers are split: a single dependency
# list would fail `uv sync` on the laptop on day one.
gpu = [
    "accelerate>=1.0",
    "bitsandbytes>=0.44",
    "peft>=0.13",
    "torch>=2.4",
    "transformers>=4.45",
    "trl>=0.11",
    "vllm>=0.6",
]

dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

# Deliberately absent: control-arena. Only its dataset is used, pulled straight
# from Hugging Face. See docs/adr/0004-*.md — it drags in 33 dependencies
# (docker, kubernetes-asyncio, minio, redis, flask) and pins
# huggingface-hub~=0.33, which would fight vllm/transformers/trl on the GPU box.

[tool.uv]
# `src/` is imported directly from the repo root (`from src.data import ...`),
# so there is nothing to build or install. This keeps `uv sync` dependency-only.
package = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
